name: Python Quality Check

on:
  push:
    branches: [ "main", "feature-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installiamo tutti i tool richiesti dal progetto
        pip install flake8 pytest pytest-cov black isort mypy pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    # 1. Controllo formattazione (Requisito Black)
    - name: Check formatting with Black
      run: black --check src/ tests/

    # 2. Controllo ordine import (Requisito Isort)
    - name: Sort imports with isort
      run: isort --check-only src/ tests/

    # 3. Controllo tipi statici (Requisito Mypy)
    - name: Static type check with Mypy
      run: mypy src/

    # 4. Linting con Flake8
    - name: Lint with Flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Linting con Pylint (Requisito Pylint)
    - name: Lint with Pylint
      run: pylint src/

    # 6. Test e Coverage al 75% (Requisito fondamentale!)
    - name: Test with pytest and coverage
      run: |
        pytest --cov=src --cov-report=term-missing --cov-fail-under=75